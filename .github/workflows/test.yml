name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (ipopt itself is a compiled solver, not installable via pip; see README)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Test (non-slow; validates the rename, shims, and pure-Python modules)
        run: pytest -q
